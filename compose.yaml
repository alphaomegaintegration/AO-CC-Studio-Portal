services:
  studio:
    build:
      context: .
      dockerfile: Dockerfile
    image: ao-continuum-code-studio:local
    init: true
    restart: unless-stopped
    ports:
      - "${STUDIO_PORT:-8787}:8787"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8787
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
